name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Opt JS-based actions (checkout, upload-artifact, msvc-dev-cmd, etc.) into
# Node.js 24 ahead of the June 2026 default switch. Silences the deprecation
# warning that's emitted while those actions still ship Node 20 binaries.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # required by softprops/action-gh-release to publish releases
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build (RELEASE x64)
        shell: pwsh
        run: .\Build.ps1 -Configuration RELEASE -Architecture x64 -SkipBuildToolsSetup $true

      - name: Run tests
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Path bin -Filter "test_*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "RUN  $($_.Name)"
            & $_.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAIL $($_.Name) (exit $LASTEXITCODE)"
              $failed++
            } else {
              Write-Host "PASS $($_.Name)"
            }
          }
          if ($failed -gt 0) { exit 1 }

      # Use the tag name (e.g. "v1.0.0") for tag-triggered runs so release
      # assets get clean filenames; fall back to short SHA for branch / PR
      # builds where there's no tag.
      - name: Compute artifact tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $name = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $name = $env:GITHUB_SHA.Substring(0, 7)
          }
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stage release artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $stage = "release/gamesir-nova-hd-rumble-xinput"
          New-Item -Path $stage -ItemType Directory -Force | Out-Null
          New-Item -Path "$stage\profiles" -ItemType Directory -Force | Out-Null
          Copy-Item "bin\gamesir-nova-hd-xinput-x64.exe" "$stage\gamesir-nova-hd-rumble-xinput.exe"
          Copy-Item "profiles\*.json"                     "$stage\profiles\"
          Copy-Item "LICENSE"                             "$stage\"
          Compress-Archive -Path "$stage" -DestinationPath "release\gamesir-nova-hd-rumble-xinput-${{ steps.tag.outputs.name }}.zip" -Force

      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gamesir-nova-hd-rumble-xinput-${{ steps.tag.outputs.name }}
          path: release/gamesir-nova-hd-rumble-xinput-${{ steps.tag.outputs.name }}.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release/gamesir-nova-hd-rumble-xinput-${{ steps.tag.outputs.name }}.zip
          generate_release_notes: true
